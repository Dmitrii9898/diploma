{% extends "base.html" %}
{% block title %}Регистрация — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-soft"><div class="card-body">
            <h1 class="h4">Регистрация обучающегося</h1>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small">{{ field.errors|join:", " }}</div>{% endif %}
                </div>
                {% endfor %}
                <button class="btn btn-gold" type="submit">Создать учётную запись</button>
            </form>
        </div></div>
    </div>
</div>
{% endblock %}
