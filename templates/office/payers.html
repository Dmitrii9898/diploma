{% extends "base.html" %}
{% block title %}Плательщики — {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h3">Плательщики</h1>
<div class="table-responsive card card-soft"><table class="table mb-0">
    <thead><tr><th>ФИО</th><th>Телефон</th><th>Почта</th><th>Паспорт</th></tr></thead>
    <tbody>
    {% for item in items %}
    <tr><td>{{ item.full_name }}</td><td>{{ item.phone }}</td><td>{{ item.email }}</td><td>{{ item.passport }}</td></tr>
    {% endfor %}
    </tbody>
</table></div>
{% endblock %}
