{% extends "base.html" %}
{% block title %}Новый договор — {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h3">Новый договор</h1>
<p>Номер присваивается автоматически.</p>
<form method="post" enctype="multipart/form-data" class="col-lg-7">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button class="btn btn-gold" type="submit">Сохранить</button>
</form>
{% endblock %}
