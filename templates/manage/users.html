{% extends "base.html" %}
{% block title %}Пользователи — {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h3">Пользователи</h1>
<div class="table-responsive card card-soft"><table class="table mb-0">
    <thead><tr><th>Логин</th><th>ФИО</th><th>Роль</th><th></th></tr></thead>
    <tbody>
    {% for item in items %}
    <tr>
        <td>{{ item.username }}</td>
        <td>{{ item.full_name }}</td>
        <td>{{ item.role_name }}</td>
        <td>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <input type="hidden" name="user_id" value="{{ item.pk }}">
                <select class="form-select form-select-sm" name="role_id">
                    {% for role in roles %}
                    <option value="{{ role.pk }}" {% if item.role_id == role.pk %}selected{% endif %}>{{ role.name }}</option>
                    {% endfor %}
                </select>
                <button class="btn btn-sm btn-gold" type="submit">Сохранить</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table></div>
{% endblock %}
