{% extends "base.html" %}
{% block title %}Новости — {{ SITE_NAME }}{% endblock %}
{% block content %}
<h1 class="h3">Новости</h1>
<ul class="list-group">
{% for item in items %}
<li class="list-group-item d-flex justify-content-between align-items-center">
    <span>{{ item.title }} — {% if item.is_published %}опубликована{% else %}скрыта{% endif %}</span>
    <form method="post">{% csrf_token %}<input type="hidden" name="news_id" value="{{ item.pk }}"><button class="btn btn-sm btn-outline-secondary" type="submit">Переключить</button></form>
</li>
{% endfor %}
</ul>
{% endblock %}
